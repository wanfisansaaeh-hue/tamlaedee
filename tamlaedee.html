<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#123a9e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ทำเลดี">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<title>ทำเลดี</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: desktop = controls | map | analysis; <=900px = map / analysis / compare tabs with a bottom nav. */
:root{
  --bg:#eef0ec;--surface:#fff;--surface-2:#f5f7f3;--ink:#17201b;--muted:#5d6862;--line:#dce1da;
  --pinA:#1f4fd6;--pinB:#c2410c;--pinC:#7c3aed;--good:#1d8549;--warn:#b77d06;--bad:#c8372d;
  --comp:#d23f33;--gen:#1f6fb2;--cmpl:#2b9a43;
  --f-display:'Bai Jamjuree','IBM Plex Sans Thai','Leelawadee UI',Tahoma,sans-serif;
  --f-body:'IBM Plex Sans Thai','Leelawadee UI',Tahoma,system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root{
  --bg:#101412;--surface:#181d1a;--surface-2:#1f2521;--ink:#e5ebe6;--muted:#98a39d;--line:#2b332e;
  --pinA:#6f8fff;--pinB:#f0844a;--pinC:#a98bff;--good:#45c07a;--warn:#e2ac2e;--bad:#f0605a;
  --comp:#f0605a;--gen:#4d9de3;--cmpl:#41c25d;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.55 var(--f-body);display:flex;flex-direction:column;height:100dvh}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--pinA);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--muted)}.small{font-size:12.5px}.err{color:var(--bad)}.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* header */
.hdr{display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex:none;position:relative;z-index:1100}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.logo{display:block;filter:drop-shadow(0 1px 2px rgb(18 58 158/.25))}
.wordmark h1{font-size:20px;line-height:1.05}
.wordmark p{margin:0;color:var(--pinA);font:600 9.5px/1 var(--f-mono);letter-spacing:1.6px}
.tagline{color:var(--muted);font-size:12.5px;padding-left:12px;border-left:1px solid var(--line);white-space:nowrap}
.search{position:relative;flex:1;max-width:440px;min-width:0;margin-left:auto}
.search>.ic{position:absolute;left:11px;top:50%;width:18px;height:18px;transform:translateY(-50%);stroke:var(--muted);pointer-events:none}
.search input{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:8px 12px 8px 36px}
.sres{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgb(0 0 0/.16);overflow:auto;max-height:340px;z-index:20}
.sres button{display:grid;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:8px 12px}
.sres button:first-child{border-top:0}.sres button:hover{background:var(--surface-2)}
.sres b{font-weight:500}.sres span{font-size:12px;color:var(--muted)}.sres p{margin:0;padding:10px 12px;color:var(--muted);font-size:13px}
.locate{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 12px;font-weight:500;font-size:13.5px;white-space:nowrap;color:var(--pinA);flex:none}
.locate .ic{width:18px;height:18px}
.hlinks{display:flex;gap:6px;flex:none}
.hlinks button,.legal-links button{border:0;background:none;padding:4px 6px;color:var(--pinA);font-size:12.5px;text-decoration:underline;text-underline-offset:2px}
.pro-chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;color:var(--pinA);white-space:nowrap;flex:none}
.pro-chip.on{background:var(--pinA);color:#fff;border-color:var(--pinA)}

/* layout */
.main{flex:1;min-height:0;display:grid;grid-template-columns:290px minmax(0,1fr) 390px}
.side,.panel{background:var(--surface);overflow:auto;padding:18px 16px;min-width:0}
.side{border-right:1px solid var(--line);display:flex;flex-direction:column;gap:22px}
.panel{border-left:1px solid var(--line);display:flex;flex-direction:column;gap:18px}
.mapwrap{position:relative;min-width:0;min-height:0}
#map{position:absolute;inset:0;background:var(--surface-2);cursor:crosshair}
.lbl{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.4px;margin:0 0 8px}
.pb{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;color:#fff;font:700 12px var(--f-display);flex:none}
.pA{background:var(--pinA)}.pB{background:var(--pinB)}.pC{background:var(--pinC)}
.pill{display:inline-block;font-size:12.5px;font-weight:600;padding:2px 10px;border-radius:999px}
.pill.good{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.pill.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);font-weight:500;font-size:13px;padding:5px 12px;border-radius:7px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0/.14)}
.tabs{display:grid;grid-template-columns:1fr 1fr}
.legend{display:grid;gap:7px;font-size:13px}.legend span{display:flex;align-items:center;gap:8px}
.lg{width:12px;height:12px;border-radius:50%;flex:none}.lg.c{background:var(--comp)}.lg.g{background:var(--gen)}.lg.k{background:var(--cmpl)}
.src{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;margin-top:auto}.src b{color:var(--ink);font-weight:600}
.hint{position:absolute;bottom:24px;left:12px;z-index:1001;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:13px;box-shadow:0 2px 8px rgb(0 0 0/.08);pointer-events:none;display:flex;align-items:center;gap:8px}
.ex{display:flex;flex-wrap:wrap;gap:6px}

/* business picker */
.bizpick{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.grp{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}.gname{font-size:12.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13.5px;line-height:1.4}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.custom{display:flex;gap:6px}
.custom input{flex:1;min-width:0;width:0;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:7px 10px}
.custom button{border:0;background:var(--pinA);color:#fff;border-radius:10px;padding:0 12px;font-weight:600;white-space:nowrap}
.pinrows{display:grid;gap:6px}
.pinrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px}
.pinrow[aria-pressed="true"]{border-color:var(--ink)}.pinrow b{display:block;font-weight:600}
.pinrow>span:nth-child(2){min-width:0}.pinrow .small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pinrow .num{font-size:18px}

/* analysis */
.score{display:flex;gap:16px;align-items:center}.ring{flex:none}
.ring-bg{fill:none;stroke:var(--surface-2);stroke-width:10}.ring-fg{fill:none;stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .4s}
.t-good{stroke:var(--good)}.t-warn{stroke:var(--warn)}.t-bad{stroke:var(--bad)}
.ring-num{fill:var(--ink);font-family:var(--f-display);font-weight:700}
.sinfo{display:grid;gap:4px;min-width:0}.sinfo .eb{display:flex;align-items:center;gap:8px;font-weight:600}
.sec h3{font-size:16px;margin-bottom:10px}
.facs{display:grid;gap:12px}
.fac{display:grid;grid-template-columns:1fr auto;gap:3px 10px;align-items:baseline}
.fac .bar{grid-column:1/-1;height:7px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.fac .bar i{display:block;height:100%;border-radius:4px}
.bar .good{background:var(--good)}.bar .warn{background:var(--warn)}.bar .bad{background:var(--bad)}
.fac small{grid-column:1/-1;color:var(--muted);font-size:12px}
.ai{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:14px;display:grid;gap:10px}
.ai h3{font-size:16px}.ai ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.ai li{display:grid;grid-template-columns:18px 1fr;gap:6px}.ai li::before{font-weight:700;text-align:center}
.ai li.p::before{content:"+";color:var(--good)}.ai li.n::before{content:"!";color:var(--bad)}.ai li.i::before{content:"i";color:var(--muted);font-style:italic}
.ai .rec{border-top:1px solid var(--line);padding-top:10px;font-weight:500}
.act{justify-self:start;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 14px;font-weight:600;font-size:13px}
.act.primary{background:var(--pinA);color:#fff;border-color:var(--pinA)}
.actrow{display:flex;gap:8px;flex-wrap:wrap}
.comps{display:grid}.cp{display:grid;grid-template-columns:1fr auto;gap:0 10px;padding:8px 0;border-top:1px solid var(--line)}
.cp:first-child{border-top:0}.cp b{font-weight:500;min-width:0;overflow-wrap:anywhere}
.empty{color:var(--muted);margin:8px 0}.empty.err{color:var(--bad)}
.warnbox{font-size:12.5px;color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent);border-radius:8px;padding:6px 10px}
.tablewrap{overflow-x:auto}table.cmp{width:100%;border-collapse:collapse;font-size:13.5px}
.cmp th,.cmp td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:center}
.cmp th:first-child,.cmp td:first-child{text-align:left;color:var(--muted);font-weight:400}
.cmp thead button{border:0;background:none;display:grid;justify-items:center;gap:4px;width:100%;padding:0}
.cmp .tot td{font:700 22px var(--f-display);color:var(--ink)}.cmp .tot td:first-child{font:400 13.5px var(--f-body);color:var(--muted)}
.cmp .best{background:color-mix(in srgb,var(--good) 8%,transparent)}.cmp-sum{margin:12px 0 0;font-size:13.5px}
.legal-links{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:6px;font-size:12.5px;color:var(--muted)}
.legal-links p{margin:0}.legal-links div{display:flex;flex-wrap:wrap;gap:4px 10px}.legal-links button{padding:0}

/* PRO */
.badge{display:inline-block;font:700 10.5px/1 var(--f-mono);letter-spacing:.8px;background:linear-gradient(135deg,#2a5cf0,#7c3aed);color:#fff;padding:3px 6px;border-radius:5px;vertical-align:middle}
.ent{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;border-radius:10px;padding:8px 12px;font-size:12.5px;background:color-mix(in srgb,var(--pinA) 10%,var(--surface))}
.ent.warn{background:color-mix(in srgb,var(--warn) 14%,var(--surface))}
.ent button{border:0;background:none;color:var(--pinA);font-weight:600;text-decoration:underline;font-size:12.5px;padding:0}
.pro{border:1px solid color-mix(in srgb,var(--pinA) 35%,var(--line));border-radius:12px;padding:14px;display:grid;gap:14px}
.pro-h{display:flex;align-items:center;justify-content:space-between;gap:8px}.pro-h h3{font-size:16px}
.pro h4{margin:0 0 6px;font:600 13.5px var(--f-body)}
.lockl{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:13px;color:var(--muted)}
.lockl li{display:flex;gap:8px;align-items:flex-start}
.lockl svg{width:15px;height:15px;flex:none;margin-top:3px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fit{display:grid;gap:8px}
.fit-row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:13px}
.fit-row .bar{grid-column:1/-1;height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.fit-row .bar i{display:block;height:100%;border-radius:3px}
.fit-row.cur b{color:var(--pinA)}
.sc{display:grid;grid-template-columns:auto 1fr auto;gap:8px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.sc:first-child{border-top:0}.sc .num{font-size:18px}
.form{display:grid;gap:10px}.form label{display:grid;gap:4px;font-size:13px}
.form input[type="text"],.form input[type="number"],.form select,.code-in{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:7px 10px;width:100%}
.form .check{display:flex;gap:8px;align-items:flex-start}.form .check input{margin-top:4px}
.code-in{font:12px var(--f-mono)}
.heat{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}.heat i{width:14px;height:14px;border-radius:3px;display:inline-block}

/* leaflet bits */
.leaflet-container{font-family:var(--f-body)}
.lpin{width:30px;height:40px;display:grid;place-items:start center;padding-top:6px;color:#fff;font:700 14px var(--f-display);clip-path:path('M15 40C11 30 0 24 0 14A15 15 0 0 1 30 14C30 24 19 30 15 40Z');transform:scale(.85);transform-origin:bottom center;opacity:.9}
.lpin.on{transform:none;opacity:1}.lpin.pA{background:var(--pinA)}.lpin.pB{background:var(--pinB)}.lpin.pC{background:var(--pinC)}
.lme{width:20px;height:20px;border-radius:50%;background:var(--pinA);border:3px solid #fff;box-shadow:0 0 0 8px color-mix(in srgb,var(--pinA) 22%,transparent)}

/* dialogs + toast */
.dlg-bg{position:fixed;inset:0;background:rgb(0 0 0/.45);z-index:3000;display:grid;place-items:center;padding:16px}
.dlg{position:relative;background:var(--surface);border-radius:16px;padding:22px 20px 18px;width:min(520px,100%);max-height:min(88dvh,760px);overflow:auto;display:grid;gap:10px;box-shadow:0 20px 50px rgb(0 0 0/.3)}
.dlg h3{font-size:18px;padding-right:30px}.dlg h4{margin:8px 0 0;font:600 14px var(--f-body)}.dlg p{margin:0}.dlg ul{margin:0;padding-left:20px;display:grid;gap:4px}
.dlg-x{position:absolute;top:12px;right:12px;border:0;background:var(--surface-2);border-radius:50%;width:30px;height:30px}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;flex-wrap:wrap}
.dlg-primary,.dlg-ghost{border-radius:10px;padding:9px 16px;font-weight:600;font-size:13.5px}
.dlg-primary{border:0;background:var(--pinA);color:#fff}.dlg-ghost{border:1px solid var(--line);background:var(--surface)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));width:max-content;max-width:min(460px,calc(100% - 32px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-size:13.5px;z-index:4000;box-shadow:0 8px 24px rgb(0 0 0/.25)}

/* mobile-only parts */
.m-only{display:none}
@media (max-width:900px){
  .hdr{padding:8px 12px;gap:8px}.wordmark,.tagline,.hlinks,.locate span,.hdr .pro-chip{display:none}.locate{padding:7px}
  .search{max-width:none}.search input{font-size:16px}
  .main{grid-template-columns:minmax(0,1fr)}.side{display:none}.panel{border-left:0}
  body[data-mview="map"] .panel{display:none}body[data-mview="panel"] .mapwrap{display:none}
  .hint{display:none}.tabs{display:none}
  .m-only{display:flex}
  .m-biz{align-items:center;gap:8px;border-bottom:1px solid var(--line);background:var(--surface);padding:8px 16px;flex:none;width:100%}
  .m-biz .pick{flex:1;min-width:0;display:flex;align-items:center;gap:8px;border:0;background:none;padding:0;text-align:left}
  .m-biz .pick b{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .m-chips{position:absolute;top:10px;left:56px;right:10px;justify-content:flex-end;gap:6px;flex-wrap:wrap;z-index:1001;pointer-events:none}
  .m-chips>*{pointer-events:auto}.m-chips .seg{background:var(--surface);box-shadow:0 1px 4px rgb(0 0 0/.12)}.m-chips .seg button{padding:4px 8px}
  .pchips{display:flex;gap:6px}
  .pchip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px 3px 3px;font-size:13px;box-shadow:0 1px 4px rgb(0 0 0/.1)}
  .pchip[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
  .m-card{position:absolute;left:10px;right:10px;bottom:22px;z-index:1001;background:var(--surface);border-radius:16px;padding:12px;gap:12px;align-items:center;box-shadow:0 4px 18px rgb(0 0 0/.18)}
  .m-card .info{flex:1;min-width:0;display:grid;gap:3px}.m-card .info b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .m-card .go{border:0;background:var(--ink);color:var(--surface);border-radius:10px;padding:8px 12px;font-weight:600;font-size:13px;white-space:nowrap}
  .ring-ph{width:60px;height:60px;border-radius:50%;border:8px solid var(--surface-2);flex:none}
  .m-nav{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);flex:none;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--surface)}
  .m-nav button{border:0;background:none;display:grid;justify-items:center;gap:2px;padding:8px 0 6px;font-size:12px;color:var(--muted)}
  .m-nav button[aria-pressed="true"]{color:var(--pinA);font-weight:600}
  .toast{bottom:calc(80px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:1100px) and (min-width:901px){.tagline{display:none}}
@media (prefers-reduced-motion:reduce){.ring-fg{transition:none}}

.install-bar{align-items:center;gap:10px;padding:6px 16px;background:color-mix(in srgb,var(--pinA) 10%,var(--surface));border-bottom:1px solid var(--line);font-size:13px;flex:none;width:100%}
.install-bar span{flex:1;min-width:0}
.install-bar button{border:0;background:none;color:var(--pinA);font-weight:600;font-size:13px;padding:0 4px;text-decoration:underline;text-underline-offset:2px}
.install-bar button[data-act="install-dismiss"]{text-decoration:none;color:var(--muted);font-size:15px}

.pay{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:start}
.pay ol{margin:0;padding-left:18px;display:grid;gap:6px}
.qr svg{display:block;width:150px;height:150px;background:#fff;border-radius:8px;border:1px solid var(--line)}
@media (max-width:460px){.pay{grid-template-columns:1fr}.qr{justify-self:center}}
#busy{position:fixed;top:76px;left:50%;transform:translateX(-50%);z-index:2500;width:min(92vw,400px);display:flex;gap:14px;align-items:center;background:var(--surface);color:var(--ink);border:2px solid var(--pinA);border-radius:14px;padding:12px 16px;box-shadow:0 8px 28px rgb(0 0 0/.28);pointer-events:none}
#busy b{font-size:15px}#busy .big{display:block}#busy .big b{font-size:26px;font-variant-numeric:tabular-nums;color:var(--pinA)}#busy small{display:block;color:var(--muted);font-size:12px}
.spin{flex:none;width:30px;height:30px;border-radius:50%;border:4px solid color-mix(in srgb,var(--pinA) 25%,transparent);border-top-color:var(--pinA);animation:tlspin .9s linear infinite}
@keyframes tlspin{to{transform:rotate(360deg)}}
.rseg{flex-wrap:wrap;max-width:100%}.m-chips .rseg{flex-wrap:nowrap;overflow-x:auto;max-width:92vw}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 10px}
.plancard{display:grid;gap:2px;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 12px}
.plancard[aria-pressed="true"]{border-color:var(--pinA);background:color-mix(in srgb,var(--pinA) 8%,var(--surface))}

<script>
(() => {
'use strict';

/* ---------- owner settings (the admin page fills these in; see README-th.md) ---------- */
const CONFIG = {
  PUBLIC_KEY: /*PUBLIC_KEY*/{"kty":"EC","crv":"P-256","x":"0-1pqcZF_4IAwrk4gTwe8xfY_C3IX9xY5P0TeYyHiSE","y":"WLXbS0fVN2yioXHbeilr8ipv-T885iHfojMjP7eRt3U"}/*END_PUBLIC_KEY*/,
  CONTACT: /*CONTACT*/'LINE @097wgyfr'/*END_CONTACT*/,

  PRICES: /*PRICES*/'PRO รายเดือน 690 บาท · ทดลองใช้ 7 วัน 69 บาท'/*END_PRICES*/,
  PLANS: { trial: { name: 'ทดลองใช้ 7 วัน', price: 69, days: 7 }, month: { name: 'PRO รายเดือน', price: 690, days: 30 } },
  // Hosted card-payment links (Stripe / gateway). Success redirect must be: <app url>?paid=trial&k=<token> (see payment-setup-th.md). Empty = card not open yet, PromptPay QR is shown instead.

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmtM = (m) => (m >= 1000 ? (m / 1000).toFixed(1) + ' กม.' : Math.round(m / 10) * 10 + ' ม.');

const LSK = { lic: 'tl-license-v1', trial: 'tl-trial-start-v1', gps: 'tl-gps-consent-v1', installDismissed: 'tl-install-dismissed-v1', paid: 'tl-paid-until-v1', device: 'tl-device-v1', card: 'tl-card-until-v1', plan: 'tl-card-plan-v1', trialUsed: 'tl-trial-used-v1', promo: 'tl-promo-day-v1' };

/* ---------- logo ---------- */
const LOGO = (size) => `<svg class="logo" width="${size}" height="${size}" viewBox="0 0 32 32" role="img" aria-label="ทำเลดี"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a5cf0"/><stop offset="1" stop-color="#123a9e"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#lg)"/><path d="M16 27.5S7.5 19 7.5 13a8.5 8.5 0 0 1 17 0c0 6-8.5 14.5-8.5 14.5Z" fill="#fff"/><rect x="11.4" y="13.2" width="2.3" height="3.6" rx=".7" fill="#7fa1ff"/><rect x="14.85" y="10.6" width="2.3" height="6.2" rx=".7" fill="#3f6df2"/><rect x="18.3" y="8" width="2.3" height="8.8" rx=".7" fill="#123a9e"/></svg>`;

const iconSvg = (size, rx) => LOGO(size).replace(' class="logo"', '').replace(/ role="img" aria-label="[^"]*"/, '').replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" ').replace('rx="9"', `rx="${rx}"`);
document.head.insertAdjacentHTML('beforeend', '<link rel="icon" href="data:image/svg+xml,' + encodeURIComponent(iconSvg(32, 9)) + '">');
{ // iPhone home-screen icon: iOS needs a PNG, so draw one from the logo (square; iOS rounds the corners itself)
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = c.height = 180;
    c.getContext('2d').drawImage(img, 0, 0, 180, 180);
    const l = document.createElement('link');
    l.rel = 'apple-touch-icon'; l.sizes = '180x180'; l.href = c.toDataURL('image/png');
    document.head.appendChild(l);
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(iconSvg(180, 0));
}

/* ---------- PRO access: 30-day trial + signed license codes (checked in the browser) ---------- */
let ENT = { active: false, kind: 'loading' };
const b64uToBytes = (s) => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4)), (c) => c.charCodeAt(0));

async function verifyLicense(code) {
  if (!code || !CONFIG.PUBLIC_KEY || !(self.crypto && crypto.subtle)) return null;
  const m = /^TL1\.([A-Za-z0-9_-]+)\.([A-Za-z0-9_-]+)$/.exec(code.trim());
  if (!m) return null;
  try {
    const key = await crypto.subtle.importKey('jwk', CONFIG.PUBLIC_KEY, { name: 'ECDSA', namedCurve: 'P-256' }, false, ['verify']);
    const ok = await crypto.subtle.verify({ name: 'ECDSA', hash: 'SHA-256' }, key, b64uToBytes(m[2]), new TextEncoder().encode(m[1]));
    if (!ok) return null;
    const p = JSON.parse(new TextDecoder().decode(b64uToBytes(m[1])));
    const e = String(p.e || '');
    if (!/^\d{8}$/.test(e)) return null;
    // valid through the end of that calendar day in the customer's own time zone
    return { id: p.i || '', expMs: new Date(+e.slice(0, 4), +e.slice(4, 6) - 1, +e.slice(6, 8), 23, 59, 59, 999).getTime() };
  } catch { return null; }
}

// A short reference for this phone/browser, shown at payment time so the owner knows whom to switch on.
let _device = null;
function deviceId() {
  if (_device) return _device;
  _device = lsGet(LSK.device);
  if (!_device) {
    const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    _device = Array.from(crypto.getRandomValues(new Uint8Array(6)), (b) => A[b % A.length]).join('');
    lsSet(LSK.device, _device);
  }
  return _device;
}

// The owner lists paid references in activations.json, e.g. {"K7M2QX": "2026-12-31"}; the app reads it when opened.
async function fetchActivation() {
  try {
    const r = await fetch(`activations.json?t=${Math.floor(Date.now() / 60000)}`, { cache: 'no-store' });
    if (!r.ok) throw new Error('no list');
    const until = (await r.json())[deviceId()];
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(until || ''));
    const ms = m ? new Date(+m[1], +m[2] - 1, +m[3], 23, 59, 59, 999).getTime() : null;
    lsSet(LSK.paid, ms ? String(ms) : null);
    return ms;
  } catch {
    const kept = Number(lsGet(LSK.paid)); // offline: keep the last known paid date
    return kept > 0 ? kept : null;
  }
}

async function initEnt() {
  const lic = await verifyLicense(lsGet(LSK.lic));
  const paidUntil = await fetchActivation();
  const card = Number(lsGet(LSK.card)) || 0; // set when a card payment returns to the app
  const best = Math.max(lic ? lic.expMs : 0, paidUntil || 0, card);
  if (best && Date.now() <= best) ENT = { active: true, kind: 'paid', until: best, plan: card === best ? lsGet(LSK.plan) : '' };
  else ENT = { active: false, kind: best ? 'expired' : 'free' };
  renderAll();
  setTimeout(maybePromo, 1500);
}
const trialEligible = () => !lsGet(LSK.trialUsed) && ENT.kind === 'free';
const sha256Hex = async (s) => Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s))), (b) => b.toString(16).padStart(2, '0')).join('');
// Hosted card page sends the customer back to ?paid=<plan>&k=<secret>; a matching secret unlocks PRO at once, no approval.
async function handlePaidReturn() {
  const sp = new URLSearchParams(location.search), plan = sp.get('paid'), k = sp.get('k');
  if (!plan) return;
  history.replaceState(null, '', location.pathname);
  const P = CONFIG.PLANS[plan];
  if (!P || !k || !(self.crypto && crypto.subtle) || !(CONFIG.PAY_HASH[plan] || []).includes(await sha256Hex(k))) { toast('ตรวจการชำระเงินไม่สำเร็จ หากตัดบัตรแล้วโปรดแจ้งทีมงาน', 9000); return; }
  if (plan === 'trial' && lsGet(LSK.trialUsed)) { toast('เครื่องนี้ใช้สิทธิ์ทดลอง 7 วันไปแล้ว เลือกแพ็กเกจรายเดือนได้เลย', 9000); return; }
  const base = Math.max(Date.now(), Number(lsGet(LSK.card)) || 0), d = new Date(base + P.days * DAY);
  const until = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 23, 59, 59, 999).getTime();
  lsSet(LSK.card, String(until)); lsSet(LSK.plan, plan);
  if (plan === 'trial') lsSet(LSK.trialUsed, '1');
  closeDlg(); await initEnt();
  toast(`ชำระเงินสำเร็จ ปลดล็อก PRO แล้ว ใช้ได้ถึง ${fmtDate(until)}`, 8000);
}
// friendly nudge for free users: once a day, right after they have seen a result
function maybePromo() {
  if (ENT.active || ENT.kind === 'loading' || $('.dlg-bg')) return;
  const today = new Date().toDateString();
  if (lsGet(LSK.promo) === today || entry(S.active).state !== 'ok') return;
  lsSet(LSK.promo, today);
  openDlg('promo');
}

async function activate(raw) {
  const code = raw.replace(/\s+/g, '');
  if (!CONFIG.PUBLIC_KEY) return { ok: false, error: 'แอพนี้ยังไม่ได้ผูกกุญแจเจ้าของ ให้ใช้ไฟล์แอพที่สร้างจากหน้าแอดมิน' };
  if (!(self.crypto && crypto.subtle)) return { ok: false, error: 'เบราว์เซอร์นี้ปลดล็อกไม่ได้ ลองใช้ Chrome หรือ Edge รุ่นใหม่' };
  const lic = await verifyLicense(code);
  if (!lic) return { ok: false, error: 'ลิงก์ปลดล็อกไม่สมบูรณ์ ลองกดลิงก์อีกครั้งหรือขอลิงก์ใหม่จากทีมงาน' };
  if (Date.now() > lic.expMs) return { ok: false, error: `ลิงก์นี้หมดอายุเมื่อ ${fmtDate(lic.expMs)} ขอลิงก์ใหม่จากทีมงาน` };
  lsSet(LSK.lic, code);
  await initEnt();
  return { ok: true, until: lic.expMs };
}

// One-tap unlock: the owner sends a link ending in #pro=<code>; opening it activates PRO, no typing needed.
async function handleUnlockLink() {
  const m = /[#&]pro=([^&]+)/.exec(location.hash);
  if (!m) return;
  history.replaceState(null, '', location.pathname + location.search); // keep the code out of the address bar
  let code = m[1];
  try { code = decodeURIComponent(code); } catch { /* use as is */ }
  const r = await activate(code);
  toast(r.ok ? `ปลดล็อก PRO แล้ว ใช้ได้ถึง ${fmtDate(r.until)}` : r.error, r.ok ? 6000 : 9000);
}

const entLabel = () => (ENT.kind === 'paid' ? `PRO ถึง ${fmtDate(ENT.until)}` : ENT.kind === 'expired' ? 'ต่ออายุ PRO' : 'ลอง PRO 69 บาท');

  cafe: { label: 'คาเฟ่ / ร้านกาแฟ', short: 'คาเฟ่', w: { office: 1, uni: .9, school: .2, condo: .6, dorm: .5, mall: .6, hospital: .4, station: 1 }, cmpl: ['coworking', 'gym', 'bookstore'], tip: 'มุมนั่งทำงาน ปลั๊กไฟ และที่นั่งช่วงเที่ยงมักเป็นจุดที่ลูกค้าเทียบกัน' },

const SHOPM = { convenience: ['grocery', 'convenience'], supermarket: ['grocery'], greengrocer: ['grocery'], chemist: ['pharmacy'], laundry: ['laundry'], dry_cleaning: ['laundry'], hairdresser: ['barber'], beauty: ['barber'], mall: ['mall'], department_store: ['mall'], books: ['bookstore'] };
const BUILDING = { office: 'office', commercial: 'office', apartments: 'condo', dormitory: 'dorm', university: 'uni', school: 'school', hospital: 'hospital' };
const stripRe = (s) => s.replace(/[.*+?^${}()|[\]\\"]/g, ' ').trim();

function categorize(t) {
  const cats = new Set();
  if (AMENITY[t.amenity]) cats.add(AMENITY[t.amenity]);
  (SHOPM[t.shop] || []).forEach((c) => cats.add(c));
  if (BUILDING[t.building]) cats.add(BUILDING[t.building]);
  if (t.office) cats.add(t.office === 'coworking' ? 'coworking' : 'office');
  if (t.leisure === 'fitness_centre') cats.add('gym');
  if (t.railway === 'station' || t.public_transport === 'station') cats.add('station');
  if (t.highway) cats.add('mainroad');
  if (t.landuse === 'residential' && (t.name || t['name:th'])) cats.add('housing');
  return [...cats];
}

function buildQuery(p, r, q, o = {}) {
  const at = `(around:${r},${p.lat},${p.lng})`, wide = `(around:${o.wide || Math.max(2000, r)},${p.lat},${p.lng})`;
  const name = stripRe(q);
  // wide areas (> 1.5 km) hold thousands of buildings: skip generic office/commercial buildings so the server can finish
  const bld = Object.keys(BUILDING).filter((k) => !(r > 1500 && (k === 'office' || k === 'commercial'))).join('|');
  return `[out:json][timeout:${o.timeout || (r > 1500 ? 120 : 60)}];(
nwr${at}[amenity~"^(${Object.keys(AMENITY).join('|')})$"];
nwr${at}[shop~"^(${Object.keys(SHOPM).join('|')})$"];
nwr${at}[office];
nwr${at}[building~"^(${bld})$"];
nwr${at}[landuse=residential][name];
nwr${at}[leisure=fitness_centre];
nwr${wide}[railway=station];
nwr${wide}[public_transport=station];
way(around:40,${p.lat},${p.lng})[highway~"^(motorway|trunk|primary|secondary)$"];
${name ? `nwr${at}[name~"${name}",i];` : ''}
);out center tags ${o.limit || (r > 1500 ? BIG_LIMIT : MAIN_LIMIT)};`;
}

async function overpass(query, ms = 75000) {
  let last;
  for (const url of MIRRORS) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), ms);
    try {
      const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: 'data=' + encodeURIComponent(query), signal: ctrl.signal });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json();
      if (j.remark && /timed out|out of memory/i.test(j.remark) && !(j.elements || []).length) throw new Error('เซิร์ฟเวอร์ประมวลผลไม่ทัน');
      return j;
    } catch (e) { last = e; } finally { clearTimeout(timer); }
  }
  throw new Error(`ดึงข้อมูลแผนที่ไม่สำเร็จ ลองใหม่ หรือลดรัศมีให้เล็กลง (${last && last.name === 'AbortError' ? 'หมดเวลา' : (last && last.message) || 'เชื่อมต่อไม่ได้'})`);
}

function parsePlaces(json, q) {
  const name = stripRe(q);
  const qRe = name ? new RegExp(name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i') : null;
  const seen = new Set(), out = [];
  for (const el of json.elements || []) {
    const t = el.tags || {};
    const lat = el.lat ?? (el.center && el.center.lat), lng = el.lon ?? (el.center && el.center.lon);
    if (lat == null || lng == null) continue;
    const cats = categorize(t);
    const nm = t.name || t['name:th'] || t['name:en'] || '';
    if (qRe && qRe.test(nm)) cats.push('custom');
    if (!cats.length) continue;
    if (cats.includes('station')) {
      if (!nm || seen.has(nm)) { if (cats.length === 1) continue; cats.splice(cats.indexOf('station'), 1); } else seen.add(nm);
    }
    out.push({ id: `${el.type}/${el.id}`, name: nm, lat, lng, cats });
  }
  return out;
}

/* ---------- scoring ---------- */
const distanceM = (a, b) => {
  const R = 6371000, rad = Math.PI / 180, dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
};
const FACTORS = [
  { k: 'demand', label: 'แหล่งดึงคน', hint: 'ออฟฟิศ สถานศึกษา ที่พัก สถานี ในรัศมี' },
  { k: 'comp', label: 'การแข่งขัน', hint: 'คะแนนสูง = คู่แข่งน้อย' },
  { k: 'quality', label: 'ช่องว่างคุณภาพ', hint: 'ต้องใช้เรตติ้งและรีวิว (ยังไม่มีข้อมูลนี้)' },
  { k: 'access', label: 'การเดินทาง', hint: 'ระยะถึงสถานีรถไฟฟ้า และการติดถนนใหญ่' },
  { k: 'cmpl', label: 'ธุรกิจที่ส่งเสริม', hint: 'ร้านใกล้เคียงที่ช่วยส่งลูกค้าให้' },
];
const WEIGHTS = { demand: .3, comp: .25, quality: .15, access: .2, cmpl: .1 };
const tone = (v) => (v >= 65 ? 'good' : v >= 45 ? 'warn' : 'bad');
const verdict = (t) => (t >= 75 ? { th: 'ทำเลดีมาก', c: 'good' } : t >= 60 ? { th: 'น่าสนใจ', c: 'good' } : t >= 45 ? { th: 'ต้องพิจารณาเพิ่ม', c: 'warn' } : { th: 'ความเสี่ยงสูง', c: 'bad' });

function analyze(features, pin, b, radius) {
  const k = Math.pow(radius / 500, 1.4), fall = (d) => 1 - 0.5 * d / radius;
  const all = features.map((f) => ({ ...f, d: distanceM(pin, f) }));
  const inR = all.filter((f) => f.d <= radius);
  let dem = 0;
  const gens = [];
  for (const f of inR) for (const c of f.cats) {
    const v = (b.w[c] || 0) * (GEN_SIZE[c] || 0) * fall(f.d);
    if (v > 0) { dem += v; gens.push({ ...f, type: c, v }); }
  }
  gens.sort((x, y) => y.v - x.v);
  const cc = compOf(b);
  const comps = inR.filter((f) => f.cats.some((c) => cc.includes(c))).sort((x, y) => x.d - y.d);
  const str = comps.reduce((s, c) => s + 0.9 * fall(c.d), 0);
  const cm = inR.filter((f) => !f.cats.some((c) => cc.includes(c)) && f.cats.some((c) => b.cmpl.includes(c))).sort((x, y) => x.d - y.d);
  const st = all.filter((f) => f.cats.includes('station')).sort((x, y) => x.d - y.d)[0] || null;
  const onMain = all.some((f) => f.cats.includes('mainroad'));
  let access;
  if (b.access === 'road') access = onMain ? 95 : 45;
  else if (st) access = clamp(100 - st.d / 12 + (onMain ? 10 : 0), 0, 100);
  else access = onMain ? 35 : 15;
  const f = {
    demand: Math.round(100 * (1 - Math.exp(-dem / (7 * k)))),
    comp: Math.round(100 * Math.exp(-str / (5 * k))),
    quality: null,
    access: Math.round(access),
    cmpl: Math.round(100 * (1 - Math.exp(-cm.length / (2.5 * k)))),
  };
  const keys = Object.keys(WEIGHTS).filter((x) => f[x] != null);
  const wsum = keys.reduce((s, x) => s + WEIGHTS[x], 0);
  const total = Math.round(keys.reduce((s, x) => s + f[x] * WEIGHTS[x], 0) / wsum);
  return { pin, total, f, gens, comps, cm, st, onMain };
}

function entry(k) {
  const p = S.pins[k];
  if (!p) return { state: 'empty' };
  const c = cache.get(ck(p));
  if (!c || c.status === 'loading') return { state: 'loading', since: c && c.t };
  if (c.status === 'error') return { state: 'error', error: c.error };
  return { state: 'ok', a: analyze(c.features, p, bizNow(), S.radius), features: c.features, truncated: c.truncated };
}

/* ---------- summary text ---------- */
function phrase(key, good, a, b) {
  const n = a.comps.length;
  if (good) switch (key) {
    case 'demand': return `มีแหล่งดึงคนหนาแน่น เช่น ${a.gens.slice(0, 2).map((g) => g.name || TYPE_TH[g.type]).join(' และ ')}`;

    case 'access': return b.access === 'road' ? 'ติดถนนสายหลัก รถเข้าออกสะดวก' : `เดินจาก${a.st.name || 'สถานี'}ประมาณ ${Math.max(1, Math.round(a.st.d / 80))} นาที${a.onMain ? ' และติดถนนใหญ่' : ''}`;
    case 'cmpl': return `มีธุรกิจที่ช่วยส่งลูกค้า ${a.cm.length} แห่ง เช่น ${a.cm[0].name || TYPE_TH[a.cm[0].cats[0]]}`;

    case 'access': return b.access === 'road' ? 'ไม่ติดถนนสายหลัก รถเข้าออกไม่สะดวก ควรมีป้ายบอกทางชัดเจน' : a.st ? `ห่าง${a.st.name || 'สถานี'} ${fmtM(a.st.d)} ควรมีที่จอดรถหรือเดลิเวอรี่` : 'ไม่มีสถานีรถไฟฟ้าในระยะ 2 กม. ลูกค้าส่วนใหญ่ต้องขับรถหรือเดินมา';
    case 'cmpl': return 'ยังไม่ค่อยมีธุรกิจที่ช่วยส่งลูกค้าในบริเวณนี้';
  }
  return '';
}
function summary(a, b) {
  const sorted = FACTORS.filter((F) => a.f[F.k] != null).map((F) => ({ ...F, v: a.f[F.k] })).sort((x, y) => y.v - x.v);
  const pos = sorted.filter((x) => x.v >= 60).slice(0, 2).map((x) => phrase(x.k, true, a, b));
  const neg = sorted.slice().reverse().filter((x) => x.v < 50).slice(0, 2).map((x) => phrase(x.k, false, a, b));
  const rec = b.prop ? (a.total >= 75 ? `ทำเลมีศักยภาพสูงสำหรับ${b.short} ควรตรวจน้ำท่วม ผังเมือง และเดินทางจริงช่วงเร่งด่วนก่อนตัดสินใจ`
    : a.total >= 60 ? `น่าสนใจสำหรับ${b.short} แต่ควรเทียบราคา/ค่าเช่ากับทำเลรอบข้างและสำรวจหน้างานเพิ่ม`
    : a.total >= 45 ? `ศักยภาพปานกลางสำหรับ${b.short} ควรเทียบกับทำเลอื่นก่อน และดูว่าเหมาะกับการใช้ประโยชน์แบบอื่นมากกว่าหรือไม่`
    : `ยังไม่เด่นสำหรับ${b.short} ดูอันดับ "เหมาะกับทำอะไรบ้าง" ว่าทำเลนี้เหมาะกับการใช้งานแบบไหนมากกว่า`)
    : a.total >= 75 ? `เหมาะเปิด${b.short} ควรไปดูพื้นที่จริงช่วง 7:30–9:00 และ 11:30–13:00 เพื่อนับคนเดินผ่าน`
    : a.total >= 60 ? 'มีศักยภาพ แต่ควรมีจุดขายที่ต่างจากคู่แข่ง และเช็คค่าเช่าเทียบกับทำเลอื่น'
    : a.total >= 45 ? 'ควรเทียบกับทำเลอื่นก่อนตัดสินใจ หรือเน้นเดลิเวอรี่ควบคู่หน้าร้าน'
    : `ไม่แนะนำสำหรับ${b.short} ลองย้ายหมุดไปใกล้แหล่งดึงคนมากขึ้น`;
  return { pos, neg, tip: b.tip, rec };
}
function copyText(k) {
  const e = entry(k);
  if (e.state !== 'ok') return '';

function fitRows(e) {

// Area scan: scores a grid of points around the pin from one larger data fetch, to find better spots nearby.
const scanKey = () => (S.pins[S.active] ? `scan|${ck(S.pins[S.active])}` : '');
function gridScan(feats, c, b) {
  const cosLat = Math.cos(c.lat * Math.PI / 180), pts = [];
  for (let dy = -1000; dy <= 1000; dy += 250) for (let dx = -1000; dx <= 1000; dx += 250) {
    if (Math.hypot(dx, dy) > 1000) continue;
    const pt = { lat: c.lat + dy / 111320, lng: c.lng + dx / (111320 * cosLat) };
    pts.push({ ...pt, total: analyze(feats, pt, b, Math.min(S.radius, 1000)).total, center: dx === 0 && dy === 0 });
  }
  return pts;
}
function runScan() {
  const p = S.pins[S.active];
  if (!p) { toast('ปักหมุดก่อนจึงสแกนได้'); return; }
  const key = scanKey(), q = customQ(), b = bizNow(), center = { ...p };
  const R = Math.min(2000, 1000 + S.radius);
  S.scan = { key, status: 'loading', t: Date.now() };
  renderAll();
  chain = chain.then(async () => {
    try {
      const json = await overpass(buildQuery(center, R, q, { limit: SCAN_LIMIT, wide: 3000, timeout: 90 }), 100000);
      const pts = gridScan(parsePlaces(json, q), center, b);
      const greedy = [];
      // suggest only spots away from the current pin (>= 200 m) and from each other (>= 300 m)
      for (const pt of pts.slice().sort((x, y) => y.total - x.total)) {
        if (greedy.length >= 3) break;
        if (distanceM(center, pt) >= 200 && greedy.every((g) => distanceM(g, pt) >= 300)) greedy.push(pt);
      }
      S.scan = { key, status: 'ok', pts, top: greedy, centerScore: (pts.find((x) => x.center) || { total: 0 }).total, truncated: (json.elements || []).length >= SCAN_LIMIT, from: center };
    } catch (e) { S.scan = { key, status: 'error', error: e.message }; }
    renderAll();
  });
}

function compareHTML() {
  const ready = PIN_KEYS.filter((k) => entry(k).state === 'ok');
  if (ready.length < 2) return '<p class="empty">ปักหมุดอย่างน้อย 2 ทำเล (A, B, C) เพื่อเปรียบเทียบ</p>';
  const A = Object.fromEntries(ready.map((k) => [k, entry(k).a]));
  const best = ready.reduce((m, k) => (A[k].total > A[m].total ? k : m), ready[0]);
  const cls = (k) => (k === best ? 'best' : '');
  const row = (label, fn) => `<tr><td>${label}</td>${ready.map((k) => `<td class="num ${cls(k)}">${fn(A[k])}</td>`).join('')}</tr>`;
  const ba = A[best], top = FACTORS.filter((F) => ba.f[F.k] != null).sort((x, y) => ba.f[y.k] - ba.f[x.k])[0];
  return `<div class="tablewrap"><table class="cmp"><thead><tr><th></th>${ready.map((k) => `<th class="${cls(k)}"><button data-act="pickview" data-v="${k}">${pb(k)}${k === best ? '<span class="pill good">แนะนำ</span>' : `<span class="pill ${verdict(A[k].total).c}">${verdict(A[k].total).th}</span>`}</button></th>`).join('')}</tr></thead><tbody>
  <tr class="tot"><td>คะแนนรวม</td>${ready.map((k) => `<td class="${cls(k)}">${A[k].total}</td>`).join('')}</tr>
  ${FACTORS.map((F) => row(F.label, (a) => a.f[F.k] ?? '—')).join('')}${row('จำนวนคู่แข่ง', (a) => a.comps.length)}${row('ถึงสถานี', (a) => (a.st ? fmtM(a.st.d) : '> 2 กม.'))}</tbody></table></div>
  <p class="cmp-sum"><b>ทำเล ${best}</b> ได้คะแนนสูงสุด ${ba.total} คะแนน จุดเด่นคือ${top.label} (${ba.f[top.k]})</p>

}

/* ---------- map ---------- */
const map = L.map('map', { zoomControl: true }).setView([S.pins.A.lat, S.pins.A.lng], 15);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' }).addTo(map);
const scanLayer = L.layerGroup().addTo(map), placesLayer = L.layerGroup().addTo(map), pinsLayer = L.layerGroup().addTo(map);
let radiusCircle = null, meMarker = null;
const roleOf = (f, b) => (f.cats.some((c) => compOf(b).includes(c)) ? 'comp' : f.cats.some((c) => (b.w[c] || 0) > 0) ? 'gen' : f.cats.some((c) => b.cmpl.includes(c)) ? 'cmpl' : null);
const ROLE_COLOR = { comp: '#d23f33', gen: '#1f6fb2', cmpl: '#2b9a43' };
const heatColor = (v) => (v >= 65 ? '#1d8549' : v >= 45 ? '#b77d06' : '#c8372d');

function drawMap() {
  scanLayer.clearLayers(); placesLayer.clearLayers(); pinsLayer.clearLayers();
  if (radiusCircle) { radiusCircle.remove(); radiusCircle = null; }
  const ap = S.pins[S.active], b = bizNow();
  if (S.scan && S.scan.status === 'ok' && S.scan.key === scanKey()) {
    for (const t of S.scan.pts) L.circle([t.lat, t.lng], { radius: 125, stroke: false, fillColor: heatColor(t.total), fillOpacity: .42, interactive: false }).addTo(scanLayer);
    S.scan.top.forEach((t, i) => L.marker([t.lat, t.lng], { icon: L.divIcon({ className: '', html: `<div class="pb" style="background:#1d8549;width:26px;height:26px;border:2px solid #fff;font-size:13px">${i + 1}</div>`, iconSize: [26, 26], iconAnchor: [13, 13] }), interactive: false }).addTo(scanLayer));
  }
  if (ap) radiusCircle = L.circle([ap.lat, ap.lng], { radius: S.radius, color: PIN_COLOR[S.active], weight: 2, dashArray: '8 6', fillColor: PIN_COLOR[S.active], fillOpacity: .06, interactive: false }).addTo(map);
  const e = entry(S.active);
  if (e.state === 'ok') for (const f of e.features.slice(0, 1500)) {
    const role = roleOf(f, b);
    if (!role) continue;
    L.circleMarker([f.lat, f.lng], { radius: role === 'comp' ? 7 : role === 'gen' ? 6 : 5, color: '#fff', weight: 2, fillColor: ROLE_COLOR[role], fillOpacity: .92, bubblingMouseEvents: false })
      .bindTooltip(`<b>${esc(f.name || 'ไม่มีชื่อ')}</b><br>${esc(f.cats.filter((c) => TYPE_TH[c]).map((c) => TYPE_TH[c]).join(' · '))}`, { direction: 'top', offset: [0, -6] }).addTo(placesLayer);
  }
  PIN_KEYS.forEach((k) => {
    const p = S.pins[k];
    if (!p) return;
    L.marker([p.lat, p.lng], { icon: L.divIcon({ className: '', html: `<div class="lpin p${k}${k === S.active ? ' on' : ''}"><span>${k}</span></div>`, iconSize: [30, 40], iconAnchor: [15, 40] }), zIndexOffset: k === S.active ? 1000 : 0, interactive: false }).addTo(pinsLayer);
  });
  if (S.me) { if (!meMarker) meMarker = L.marker([S.me.lat, S.me.lng], { icon: L.divIcon({ className: '', html: '<div class="lme"></div>', iconSize: [20, 20], iconAnchor: [10, 10] }), interactive: false }).addTo(map); else meMarker.setLatLng([S.me.lat, S.me.lng]); }
}

let toastTimer;
function toast(msg, ms = 3500) {
  let t = $('.toast');
  if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = msg; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), ms);

async function reverse(p) {
  const key = addrKey(p);
  if (S.addr[key] !== undefined) return;
  S.addr[key] = null;
  try {
    const j = await (await fetch(`https://photon.komoot.io/reverse?lat=${p.lat}&lon=${p.lng}`)).json();
    const pr = (j.features && j.features[0] && j.features[0].properties) || {};
    S.addr[key] = [pr.street || pr.name, pr.district || pr.locality, pr.city || pr.state].filter(Boolean).slice(0, 2).join(', ');
  } catch { S.addr[key] = ''; }
  renderAll();
}

  S.pins[S.active] = { lat: p.lat, lng: p.lng };

  if (label) toast(`ปักหมุด ${S.active} ที่ ${label}`);
}

const getConsent = () => lsGet(LSK.gps) === '1';
function locate() { if (!getConsent()) { openDlg('consent'); return; } runLocate(); }
function runLocate() {
  if (!navigator.geolocation) { toast('เบราว์เซอร์นี้ไม่รองรับการหาตำแหน่ง'); return; }
  toast('กำลังหาตำแหน่งปัจจุบัน…', 10000);
  navigator.geolocation.getCurrentPosition((pos) => {

/* ---------- search (Photon, OpenStreetMap data) ---------- */
let sTimer, sCtrl, sItems = [];
const input = $('#q'), sres = $('#sres');
input.addEventListener('input', () => {
  clearTimeout(sTimer); if (sCtrl) sCtrl.abort();
  const q = input.value.trim();
  if (q.length < 2) { sres.hidden = true; return; }
  sTimer = setTimeout(async () => {
    sCtrl = new AbortController();
    try {
      const c = map.getCenter();
      const j = await (await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=6&lat=${c.lat}&lon=${c.lng}&bbox=97.3,5.6,105.7,20.5`, { signal: sCtrl.signal })).json();
      sItems = (j.features || []).map((f) => { const p = f.properties || {}; return { name: p.name || p.street || 'ไม่มีชื่อ', sub: [p.street && p.street !== p.name ? p.street : '', p.district, p.city || p.state].filter(Boolean).join(', '), lat: f.geometry.coordinates[1], lng: f.geometry.coordinates[0] }; });
      sres.innerHTML = sItems.length ? sItems.map((it, i) => `<button data-act="goto" data-v="${i}"><b>${esc(it.name)}</b><span>${esc(it.sub)}</span></button>`).join('') : `<p>ไม่พบ "${esc(q)}"</p>`;
      sres.hidden = false;
    } catch (e) { if (e.name !== 'AbortError') { sres.innerHTML = '<p>ค้นหาไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่</p>'; sres.hidden = false; } }
  }, 400);
});
input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && sItems[0] && !sres.hidden) goto(0); if (e.key === 'Escape') sres.hidden = true; });
function goto(i) {
  const it = sItems[i]; if (!it) return;
  showMap(); placePin(it, it.name); map.flyTo([it.lat, it.lng], 16, { duration: .8 });
  input.value = ''; sres.hidden = true;
}

/* PromptPay QR (standard EMVCo/Bank of Thailand format) */
const tlv = (id, v) => id + String(v.length).padStart(2, '0') + v;
function crc16(s) {
  let crc = 0xFFFF;
  for (let i = 0; i < s.length; i++) {
    crc ^= s.charCodeAt(i) << 8;
    for (let b = 0; b < 8; b++) crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) & 0xFFFF : (crc << 1) & 0xFFFF;
  }
  return crc.toString(16).toUpperCase().padStart(4, '0');
}
function promptpayPayload(id, amount) {
  const digits = String(id).replace(/\D/g, '');
  const target = digits.length <= 10 ? tlv('01', '0066' + digits.replace(/^0/, '')) : tlv('02', digits);
  const body = tlv('00', '01') + tlv('01', '12') + tlv('29', tlv('00', 'A000000677010111') + target) + tlv('58', 'TH') + tlv('53', '764') + tlv('54', Number(amount).toFixed(2)) + '6304';
  return body + crc16(body);
}
function qrSvg(text) {
  if (typeof qrcode !== 'function') return '';
  const q = qrcode(0, 'M');
  q.addData(text);
  q.make();
  return q.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
}
function payBlock(amount) {
  const id = deviceId();
  const idLine = `<p class="small muted">รหัสอ้างอิงของคุณ <b class="num">${id}</b></p>`;
  if (!CONFIG.PROMPTPAY) return `<p>ระบบชำระเงินกำลังเตรียมเปิดให้บริการ ตอนนี้ใช้ฟังก์ชันฟรีได้ตามปกติ</p>${idLine}`;
  const svg = qrSvg(promptpayPayload(CONFIG.PROMPTPAY, amount));
  return `<div class="pay"><div class="qr">${svg}</div><ol><li>สแกน QR พร้อมเพย์ด้วยแอพธนาคาร (ใส่ยอด <b>${amount} บาท</b> ให้แล้ว) หรือ <button type="button" class="act" data-act="copypp">คัดลอกเลขพร้อมเพย์</button> ไปโอนเอง</li><li>ใส่ <b class="num">${id}</b> ในช่อง "บันทึกช่วยจำ" ตอนโอน <button type="button" class="act" data-act="copyid">คัดลอก</button></li><li>ทีมงานตรวจยอดแล้วเปิดใช้ให้ กลับมาเปิดแอพนี้ได้เลย ไม่ต้องกรอกอะไรอีก</li></ol></div>${idLine}`;
}

  consent: () => `<h3>ขออนุญาตใช้ตำแหน่งปัจจุบันของคุณ</h3><p>เพื่อปักหมุดทำเลตรงตำแหน่งที่คุณยืนอยู่ แอพจะอ่านพิกัดจากอุปกรณ์ของคุณ</p><ul><li>ใช้เพื่อวางหมุดและวิเคราะห์ทำเลรอบตำแหน่งนั้นเท่านั้น</li><li>พิกัดจะถูกส่งจากเบราว์เซอร์ของคุณไปยังบริการแผนที่สาธารณะ (OpenStreetMap, Overpass, Photon) เพื่อค้นหาร้านค้าและที่อยู่</li><li>แอพนี้ไม่มีเซิร์ฟเวอร์ของตัวเอง ไม่เก็บและไม่ส่งพิกัดของคุณไปที่อื่น</li><li>ถอนความยินยอมได้ทุกเมื่อที่ปุ่ม "ความเป็นส่วนตัว" และยังใช้งานต่อได้ด้วยการปักหมุดเองหรือค้นหาสถานที่</li></ul><div class="dlg-actions"><button class="dlg-ghost" data-act="close">ไม่ยินยอม</button><button class="dlg-primary" data-act="accept">ยินยอมและใช้ตำแหน่ง</button></div>`,
  privacy: () => `<h3>ความเป็นส่วนตัวและข้อมูลส่วนบุคคล</h3><h4>ข้อมูลที่ใช้</h4><ul><li><b>ตำแหน่งปัจจุบัน (GPS)</b> ใช้เมื่อคุณกดปุ่ม "ตำแหน่งปัจจุบัน" และให้ความยินยอมเท่านั้น</li><li><b>ตำแหน่งที่ปักหมุดและคำค้นหา</b> ใช้เพื่อวิเคราะห์ทำเลและค้นหาสถานที่</li><li>แอพไม่ขอชื่อ อีเมล หรือเบอร์โทร และไม่มีการสมัครสมาชิก</li></ul><h4>ผู้ที่ได้รับข้อมูล</h4><ul><li>เบราว์เซอร์ของคุณส่งพิกัดและคำค้นหาตรงไปยัง OpenStreetMap (ภาพแผนที่), Overpass (ข้อมูลร้านค้า) และ Photon (ค้นหาสถานที่และที่อยู่) บริการเหล่านี้เห็นหมายเลข IP ของคุณตามปกติของการเปิดเว็บ</li><li>แอพนี้ไม่มีเซิร์ฟเวอร์ของตัวเอง จึงไม่เก็บข้อมูลของคุณไว้</li><li>ฟังก์ชัน "ส่งผลจริง" จะส่งข้อมูลให้ทีมงานก็ต่อเมื่อคุณติ๊กยินยอมและกดส่งเองผ่าน LINE (ซึ่งเป็นบริการของบุคคลที่สาม)</li><li>การชำระด้วยบัตรทำที่หน้าของผู้ให้บริการชำระเงิน แอพนี้ไม่เห็นและไม่เก็บเลขบัตรของคุณ</li></ul><h4>การเก็บรักษา</h4><ul><li>ผลวิเคราะห์อยู่ในหน้าจอนี้เท่านั้น ปิดหน้าแล้วหายไป</li><li>เก็บไว้ในเบราว์เซอร์ของคุณเท่านั้น: การให้ความยินยอมใช้ตำแหน่ง และสิทธิ์ PRO ที่ปลดล็อกแล้ว</li></ul><p class="muted small">สิทธิของคุณ: ถอนความยินยอมได้ทุกเมื่อด้วยปุ่มด้านล่าง</p>${getConsent() ? '<div class="dlg-actions"><button class="dlg-ghost" data-act="withdraw">ถอนความยินยอมใช้ตำแหน่ง</button></div>' : '<p class="muted small">ตอนนี้คุณยังไม่ได้ให้ความยินยอมใช้ตำแหน่งปัจจุบัน</p>'}`,
  method: () => `<h3>วิธีคิดคะแนนและข้อจำกัด</h3><h4>คะแนนรวม 0–100 มาจาก 5 ด้าน</h4><ul>${FACTORS.map((F) => `<li><b>${F.label}</b> น้ำหนัก ${Math.round(WEIGHTS[F.k] * 100)}% · ${F.hint}</li>`).join('')}</ul><p>แต่ละด้านคิดเป็น 0–100 แล้วถ่วงน้ำหนักรวมกัน ด้านที่ไม่มีข้อมูลจะถูกตัดออก และน้ำหนักของด้านที่เหลือจะปรับให้รวมเป็น 100%</p><h4>แหล่งข้อมูล</h4><p>ร้านค้า สถานที่ และสถานีรถไฟฟ้า มาจาก OpenStreetMap ซึ่งอาสาสมัครช่วยกันบันทึก บางพื้นที่จึงมีร้านไม่ครบหรือข้อมูลไม่ทันสมัย</p><h4>ข้อจำกัดที่ควรรู้</h4><ul><li>ยังไม่มีเรตติ้งและรีวิวของลูกค้า จึงยังคำนวณด้าน "ช่องว่างคุณภาพ" ไม่ได้</li><li>ไม่รวมค่าเช่า ปริมาณคนเดินผ่านจริง ที่จอดรถ ทิศทางการจราจร กำลังซื้อ และกฎผังเมือง</li><li>สูตรเป็นแบบจำลองเบื้องต้น ยังไม่ได้ทดสอบเทียบกับผลประกอบการของร้านจริง</li><li>คะแนนสูงไม่ได้รับประกันว่าธุรกิจจะประสบความสำเร็จ และคะแนนต่ำไม่ได้แปลว่าไม่ควรเปิด</li></ul><p>ใช้ผลนี้เป็นจุดตั้งต้นในการเลือกทำเล แล้วไปสำรวจพื้นที่จริงทั้งวันธรรมดาและวันหยุดก่อนตัดสินใจ</p>`,
  biz: () => `<h3>เลือกประเภทธุรกิจ</h3>${bizPicker()}`,
  license: () => `<h3>ฟังก์ชันเชิงลึก <span class="badge">PRO</span></h3>${licenseStatus()}
    <h4>ฟรีตลอด</h4><ul><li>วิเคราะห์ทำเล คะแนน 5 ด้าน คู่แข่ง แหล่งดึงคน เทียบ 3 ทำเล ค้นหา ตำแหน่งปัจจุบัน และคัดลอกสรุปไปวางใน LINE</li></ul>
    <h4>PRO ใช้วิเคราะห์อะไรได้บ้าง</h4>${PRO_LIST()}
    ${ENT.active ? '<p class="small muted">ขอบคุณที่ใช้ PRO ค่ะ ใช้งานได้เต็มที่จนถึงวันที่ระบุด้านบน</p>' : `<h4>เลือกแพ็กเกจ</h4>${planPicker()}`}
    ${lsGet(LSK.lic) ? '<p><button type="button" class="dlg-ghost" data-act="licclear">ยกเลิกการปลดล็อกบนเครื่องนี้</button></p>' : ''}`,
  promo: () => `<h3>อยากรู้ลึกกว่านี้ไหม?</h3><p>ผลวิเคราะห์พื้นฐานใช้ฟรีตลอด ถ้าต้องการข้อมูลเพิ่ม PRO ช่วยได้:</p>${PRO_LIST()}
    <div class="dlg-actions">${trialEligible() ? '<button class="dlg-primary" data-act="plan-open" data-v="trial">ลองใช้ 7 วัน 69 บาท</button>' : ''}<button class="${trialEligible() ? 'dlg-ghost' : 'dlg-primary'}" data-act="plan-open" data-v="month">PRO 690 บาท/เดือน</button><button class="dlg-ghost" data-act="close">ไว้ก่อน</button></div>`,
  radius: () => `<h3>กำหนดรัศมีเอง</h3><p class="muted small">ตั้งได้ 100 เมตร ถึง ${CONFIG.MAX_RADIUS / 1000} กิโลเมตร รัศมีกว้างข้อมูลเยอะ อาจใช้เวลานานขึ้น</p><form class="custom" data-form="radius"><input name="km" type="number" inputmode="decimal" min="0.1" max="${CONFIG.MAX_RADIUS / 1000}" step="0.1" value="${+(S.radius / 1000).toFixed(1)}" aria-label="รัศมีเป็นกิโลเมตร"> <span>กม.</span><button type="submit">ใช้รัศมีนี้</button></form>`,
  contrib: contribForm,
  install: installDialog,
};
function closeDlg() { const d = $('.dlg-bg'); if (d) d.remove(); }
function openDlg(kind) {
  closeDlg();
  const d = document.createElement('div');
  d.className = 'dlg-bg';
  d.innerHTML = `<div class="dlg" role="dialog" aria-modal="true"><button class="dlg-x" data-act="close" aria-label="ปิด">✕</button>${DLG[kind]()}${kind === 'method' || kind === 'privacy' ? '<div class="dlg-actions"><button class="dlg-primary" data-act="close">ปิด</button></div>' : ''}</div>`;
  d.addEventListener('click', (e) => { if (e.target === d) closeDlg(); });
  document.body.appendChild(d);
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDlg(); });

/* ---------- events ---------- */
function applyCustom(text) {
  const hit = KEYWORDS.find(([re]) => re.test(text));
  if (hit) { S.biz = hit[1]; toast(`"${text}" ตรงกับหมวด ${BIZ[hit[1]].label} จึงใช้หมวดนี้วิเคราะห์`); }
  else { S.custom = text; S.biz = 'custom'; toast(`วิเคราะห์ "${text}" โดยนับคู่แข่งจากชื่อร้านที่มีคำนี้`); }
}
function setRadius(m) {
  S.radius = clamp(Math.round(m / 10) * 10, 100, CONFIG.MAX_RADIUS);
  refresh();
  const p = S.pins[S.active];
  if (p && S.radius > 1000) map.fitBounds(L.circle([p.lat, p.lng], { radius: S.radius }).getBounds(), { padding: [24, 24], maxZoom: 16 });
}
const needPro = () => { if (ENT.active) return false; openDlg('license'); return true; };
async function copyToClipboard(txt, okMsg) {
  try { await navigator.clipboard.writeText(txt); toast(okMsg); } catch { window.prompt('คัดลอกข้อความนี้', txt); }
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('.search')) sres.hidden = true;
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const v = t.dataset.v;
  switch (t.dataset.act) {
    case 'biz': S.biz = v; closeDlg(); refresh(); break;
    case 'radius': setRadius(+v); break;
    case 'plan': payPlan = v; openDlg('license'); break;
    case 'plan-open': payPlan = v; openDlg('license'); break;
    case 'pin': S.active = v; if (S.pins[v]) map.flyTo([S.pins[v].lat, S.pins[v].lng], Math.max(map.getZoom(), 15), { duration: .6 }); renderAll(); break;
    case 'ex': { const x = EXAMPLES[+v]; showMap(); placePin({ lat: x[1], lng: x[2] }, x[0]); map.flyTo([x[1], x[2]], 16, { duration: .8 }); break; }
    case 'pickview': S.active = v; S.tab = 'analysis'; renderAll(); break;
    case 'tab': S.tab = v; renderAll(); break;
    case 'mview':
      if (v === 'map') { S.mview = 'map'; } else { S.mview = 'panel'; S.tab = v; }
      document.body.dataset.mview = S.mview; renderAll(); setTimeout(() => map.invalidateSize(), 50); break;
    case 'goto': goto(+v); break;
    case 'locate': locate(); break;
    case 'dlg': openDlg(v); break;
    case 'close': closeDlg(); break;
    case 'accept': lsSet(LSK.gps, '1'); closeDlg(); runLocate(); break;
    case 'withdraw': lsSet(LSK.gps, null); closeDlg(); toast('ถอนความยินยอมใช้ตำแหน่งแล้ว'); break;
    case 'licclear': lsSet(LSK.lic, null); closeDlg(); initEnt(); toast('ยกเลิกการปลดล็อกบนเครื่องนี้แล้ว'); break;
    case 'copypp': copyToClipboard(CONFIG.PROMPTPAY, 'คัดลอกเลขพร้อมเพย์แล้ว นำไปโอนในแอพธนาคารได้เลย'); break;
    case 'copyid': copyToClipboard(deviceId(), 'คัดลอกรหัสอ้างอิงแล้ว วางในช่องบันทึกช่วยจำตอนโอนได้เลย'); break;
    case 'install-dismiss': lsSet(LSK.installDismissed, '1'); renderHeader(); break;
    case 'install-go': if (deferredInstall) { deferredInstall.prompt(); deferredInstall.userChoice.finally(() => { deferredInstall = null; closeDlg(); }); } break;
    case 'retry': { const p = S.pins[S.active]; if (p) cache.delete(ck(p)); refresh(); break; }
    case 'copy': copyToClipboard(copyText(S.active), 'คัดลอกสรุปแล้ว นำไปวางใน LINE ได้เลย'); break;
    case 'scan': if (!needPro()) runScan(); break;
    case 'scanclear': S.scan = null; renderAll(); break;
    case 'usescan': { const s = S.scan; const t2 = s && s.top[+v]; if (t2) { S.scan = null; placePin({ lat: t2.lat, lng: t2.lng }, 'จุดที่แนะนำ'); map.flyTo([t2.lat, t2.lng], 17, { duration: .8 }); showMap(); } break; }
    case 'report': {
      if (needPro()) break;
      const html = buildReport();
      if (!html) { toast('ยังไม่มีผลวิเคราะห์ให้ทำรายงาน รอข้อมูลโหลดก่อน'); break; }
      $('#report').innerHTML = html;
      setTimeout(() => window.print(), 150);
      break;
    }
    case 'contrib-copy': { const txt = contribText(); if (txt) copyToClipboard(txt, 'คัดลอกข้อความแล้ว ส่งให้ทีมงานทาง LINE ได้เลย'); break; }
    case 'contrib-send': { const txt = contribText(); if (txt) { window.open('https://line.me/R/share?text=' + encodeURIComponent(txt), '_blank', 'noopener'); toast('เปิด LINE แล้ว เลือกทีมงานเพื่อส่ง'); } break; }
  }
});
document.addEventListener('submit', async (e) => {
  const f = e.target.closest('[data-form]');
  if (!f) return;
  e.preventDefault();
  if (f.dataset.form === 'radius') {
    const km = parseFloat(f.elements.km.value);
    if (!(km >= 0.1)) { toast('ใส่รัศมีเป็นกิโลเมตร เช่น 1.5'); return; }
    closeDlg(); setRadius(km * 1000);
    if (km * 1000 > CONFIG.MAX_RADIUS) toast(`รัศมีสูงสุด ${CONFIG.MAX_RADIUS / 1000} กม. ปรับให้แล้ว`);
  } else if (f.dataset.form === 'custom') {
    const text = f.elements.c.value.trim();
    if (!text) { toast('พิมพ์ประเภทร้านที่ต้องการก่อน'); return; }
    applyCustom(text); closeDlg(); refresh();
  } else if (f.dataset.form === 'paste') {
    // inside the installed app: accept the whole unlock link (or just its code part)
    const raw = f.elements.link.value.trim();
    const m = /pro=([A-Za-z0-9._-]+)/.exec(raw);
    const err = $('#pasteErr');
    if (!raw) { err.textContent = 'วางลิงก์ที่ได้รับก่อน'; return; }
    err.textContent = 'กำลังตรวจ…';
    const r = await activate(m ? m[1] : raw);
    if (r.ok) { closeDlg(); toast(`ปลดล็อก PRO แล้ว ใช้ได้ถึง ${fmtDate(r.until)}`); } else err.textContent = r.error;
  }
});
window.addEventListener('resize', () => map.invalidateSize());
setInterval(() => document.querySelectorAll('.elapsed').forEach((el) => { el.textContent = secs(Number(el.dataset.since), !!el.dataset.plain); }), 1000);

if (matchMedia('(max-width:900px)').matches) { $('#mBiz').style.display = ''; $('#mNav').style.display = ''; }
matchMedia('(max-width:900px)').addEventListener('change', (m) => { $('#mBiz').style.display = m.matches ? '' : 'none'; $('#mNav').style.display = m.matches ? '' : 'none'; setTimeout(() => map.invalidateSize(), 50); });
renderAll();
initEnt().then(handleUnlockLink).then(handlePaidReturn);
window.addEventListener('hashchange', handleUnlockLink); // an unlock link tapped while the app is already open
document.addEventListener('visibilitychange', () => { if (!document.hidden) initEnt(); }); // back from the banking app: re-check payment
reverse(S.pins.A);
ensure('A');
setTimeout(() => map.invalidateSize(), 100);
})();
</script>
</body>
</html>
